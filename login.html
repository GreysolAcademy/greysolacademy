<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Greysol Academy Portal
</title>



<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">





<style>


*{

box-sizing:border-box;

font-family:'Segoe UI',Arial,sans-serif;

}





body{


margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;


background:

linear-gradient(

135deg,

#001f3f,

#003366

);


}







.portal-box{


width:450px;

background:white;

padding:45px;

border-radius:20px;

text-align:center;


box-shadow:

0 10px 30px rgba(0,0,0,.3);


}






.logo{


width:120px;

height:120px;

object-fit:contain;


}








h1{


margin:15px 0 5px;

color:#001f3f;

font-size:32px;


}





.subtitle{


color:#777;

margin-bottom:35px;


}










.login-option{


display:flex;

align-items:center;

gap:20px;

padding:20px;

margin:20px 0;

border-radius:15px;

background:#f4f7fb;

cursor:pointer;

transition:.3s;

text-decoration:none;

color:#001f3f;


}





.login-option:hover{


background:#001f3f;

color:white;

transform:translateY(-3px);


}








.icon{


width:60px;

height:60px;

border-radius:50%;

background:#001f3f;

color:white;

display:flex;

justify-content:center;

align-items:center;

font-size:25px;


}







.login-option:hover .icon{


background:white;

color:#001f3f;


}







.text{


text-align:left;


}




.text h2{


margin:0;

font-size:22px;


}





.text p{


margin:5px 0 0;

font-size:14px;


}









.footer{


margin-top:30px;

font-size:13px;

color:#777;


}





</style>


</head>






<body>





<div class="portal-box">





<img src="images/logo1 - Copy.png"

class="logo">






<h1>

GREYSOL ACADEMY

</h1>





<p class="subtitle">

School Management Portal

</p>









<a href="admin/staff-login.html"

class="login-option">





<div class="icon">


<i class="fa-solid fa-user-tie"></i>


</div>





<div class="text">


<h2>

Staff Login

</h2>


<p>

Administrator, Teachers, Bursar & Staff

</p>


</div>





</a>













<a href="admin/student-login.html"

class="login-option">





<div class="icon">


<i class="fa-solid fa-user-graduate"></i>


</div>





<div class="text">


<h2>

Student Login

</h2>


<p>

Students access fees, statements & results

</p>


</div>





</a>












<div class="footer">


© Greysol Academy

<br>

Secure School Management System


</div>







</div>







</body>

</html>
