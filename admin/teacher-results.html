<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greysol Academy | Enter Results</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
:root{--navy:#001f3f;--light:#f4f7fb;--green:#27ae60;--orange:#f39c12}
body{margin:0;background:var(--light);display:flex;height:100vh;overflow:hidden}
.sidebar{width:270px;background:var(--navy);color:white;height:100vh;overflow:auto;position:fixed;left:0}
.logo{text-align:center;padding:20px;border-bottom:1px solid rgba(255,255,255,.2)}
.menu a{display:flex;align-items:center;gap:15px;padding:15px 25px;color:white;text-decoration:none}
.menu a.active{background:rgba(255,255,255,.1)}
.main{flex:1;display:flex;flex-direction:column;margin-left:270px}
.topbar{height:75px;background:white;display:flex;justify-content:space-between;align-items:center;padding:0 30px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.content{padding:30px;overflow:auto}
.box{background:white;padding:25px;border-radius:15px;margin-bottom:25px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:20px}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc}
.btn{padding:12px 25px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;background:var(--green);color:white}
.btn:disabled{background:#ccc;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{background:var(--navy);color:white;padding:12px;text-align:left}
td{padding:10px;border-bottom:1px solid #ddd}
input[type="number"]{width:70px}
.badge-pending{background:var(--orange);color:white;padding:4px 8px;border-radius:12px;font-size:12px}
.badge-approved{background:var(--green);color:white;padding:4px 8px;border-radius:12px;font-size:12px}
.alert{padding:12px;border-radius:8px;margin-bottom:15px}
.alert-success{background:#d4edda;color:#155724}
.alert-danger{background:#f8d7da;color:#721c24}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo"><h2>GREYSOL ACADEMY</h2><p>Teacher Portal</p></div>
  <div class="menu">
    <a href="teacher-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="teacher-results.html" class="active"><i class="fa-solid fa-file-lines"></i> Enter Results</a>
    <a href="staff-login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </div>
</div>

<div class="main">
  <div class="topbar"><h2>Enter Student Results</h2><span id="teacherName"></span></div>
  <div class="content">
    <div id="alertBox"></div>

    <div class="box">
      <h3><i class="fa-solid fa-filter"></i> Select Details</h3>
      <div class="form-grid">
        <div><label>Subject - Class</label><select id="allocationSelect"><option>Loading...</option></select></div>
        <div><label>Term</label><select id="termSelect"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div>
        <div><label>Year</label><input type="number" id="yearInput" value="2026"></div>
      </div>
    </div>

    <div class="box">
      <h3 id="listTitle"><i class="fa-solid fa-pen-to-square"></i> Enter Marks</h3>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Student ID</th><th>Name</th>
              <th>Test1 /30</th><th>Test2 /30</th><th>Exam /40</th>
              <th>Total</th><th>Grade</th><th>Remark</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="resultTable"><tr><td colspan="10">Select details above</td></tr></tbody>
        </table>
      </div>
      <button class="btn" id="saveResults" style="margin-top:15px;width:100%">Save All Results</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({apiKey:"AIzaSyAgoW4eu_hvrWHSxJciW0qUWeUXOr-msgw",authDomain:"greysol-academy.firebaseapp.com",projectId:"greysol-academy"});
const db = getFirestore(app);

const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
if(!loggedUser){ window.location.href="staff-login.html"; }

let staffID = "";
let existingResults = {};

function getGrade(total){
  if(total >= 80) return {grade:"A", remark:"Excellent"};
  if(total >= 65) return {grade:"B", remark:"Very Good"};
  if(total >= 50) return {grade:"C", remark:"Good"};
  if(total >= 40) return {grade:"D", remark:"Pass"};
  return {grade:"F", remark:"Fail"};
}

function showAlert(msg, type="success"){
  document.getElementById("alertBox").innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(()=>document.getElementById("alertBox").innerHTML="",4000);
}

async function init(){
  const staffSnap = await getDocs(query(collection(db,"staff"), where("username","==",loggedUser.username)));
  if(staffSnap.empty) return;
  const teacher = staffSnap.docs[0].data();
  staffID = teacher.staffID;
  document.getElementById("teacherName").innerText = `${teacher.firstName} ${teacher.surname}`;

  const allocSnap = await getDocs(query(collection(db,"allocations"), where("staffID","==",staffID)));
  const select = document.getElementById("allocationSelect");
  select.innerHTML = `<option value="">Select Subject - Class</option>`;
  allocSnap.forEach(d=>{
    let a = d.data();
    select.innerHTML += `<option value="${a.class}|${a.subjectName}|${a.subjectID}">${a.subjectName} - ${a.class}</option>`;
  });
}
init();

document.getElementById("allocationSelect").onchange = loadStudents;
document.getElementById("termSelect").onchange = loadStudents;
document.getElementById("yearInput").onchange = loadStudents;

async function loadStudents(){
  const val = document.getElementById("allocationSelect").value;
  if(!val) return;
  const [className, subjectName, subjectID] = val.split("|");
  const term = document.getElementById("termSelect").value;
  const year = document.getElementById("yearInput").value;

  // 1. Load existing results for this subject/term/year to prevent duplicates
  existingResults = {};
  const resSnap = await getDocs(query(collection(db,"results"),
    where("subjectID","==",subjectID), where("term","==",term), where("year","==",parseInt(year))));
  resSnap.forEach(d=> existingResults[d.data().studentID] = d.data());

  // 2. LOAD STUDENTS: CHECK BOTH class AND classApplying
  const snap1 = await getDocs(query(collection(db,"students"), where("class","==",className)));
  const snap2 = await getDocs(query(collection(db,"students"), where("classApplying","==",className)));

  let studentsList = [];
  snap1.forEach(d=> studentsList.push({id:d.id,...d.data()}));
  snap2.forEach(d=> {
    if(!studentsList.find(s=>s.id === d.id)) studentsList.push({id:d.id,...d.data()});
  });

  studentsList.sort((a,b)=> (a.surname||"").localeCompare(b.surname||""));

  const tbody = document.getElementById("resultTable");
  tbody.innerHTML = "";

  if(studentsList.length === 0){
    tbody.innerHTML = `<tr><td colspan="10">No students found in ${className}</td></tr>`;
    return;
  }

  let count = 1;
  studentsList.forEach(s=>{
    const existing = existingResults[s.id];
    let t1 = existing?.test1 || "", t2 = existing?.test2 || "", ex = existing?.exam || "";
    let total = existing?.total || 0;
    let {grade, remark} = getGrade(total);
    let statusBadge = existing? `<span class="badge-${existing.status.toLowerCase()}">${existing.status}</span>` : "-";
    let disabled = existing? "disabled" : "";

    tbody.innerHTML += `<tr data-studentid="${s.id}">
      <td>${count++}</td>
      <td>${s.studentID || s.admissionNo || '-'}</td>
      <td>${s.firstName} ${s.surname}</td>
      <td><input type="number" class="test1" max="30" value="${t1}" ${disabled}></td>
      <td><input type="number" class="test2" max="30" value="${t2}" ${disabled}></td>
      <td><input type="number" class="exam" max="40" value="${ex}" ${disabled}></td>
      <td class="total">${total}</td>
      <td class="grade">${grade}</td>
      <td class="remark">${remark}</td>
      <td>${statusBadge}</td>
    </tr>`;
  });

  document.querySelectorAll("input").forEach(inp=>{
    inp.oninput = function(){
      let row = this.closest("tr");
      let t1 = parseFloat(row.querySelector(".test1").value) || 0;
      let t2 = parseFloat(row.querySelector(".test2").value) || 0;
      let ex = parseFloat(row.querySelector(".exam").value) || 0;
      let total = t1 + t2 + ex;
      let {grade, remark} = getGrade(total);
      row.querySelector(".total").innerText = total;
      row.querySelector(".grade").innerText = grade;
      row.querySelector(".remark").innerText = remark;
    }
  });
}

// SAVE WITH DUPLICATE CHECK + PENDING STATUS
document.getElementById("saveResults").onclick = async function(){
  const val = document.getElementById("allocationSelect").value;
  if(!val){ showAlert("Select Subject and Class", "danger"); return; }
  const [className, subjectName, subjectID] = val.split("|");
  const term = document.getElementById("termSelect").value;
  const year = parseInt(document.getElementById("yearInput").value);

  this.disabled = true;
  let saved = 0, skipped = 0;

  for(let row of document.querySelectorAll("#resultTable tr[data-studentid]")){
    let studentID = row.getAttribute("data-studentid");

    if(existingResults[studentID]){
      skipped++;
      continue;
    }

    let test1 = parseFloat(row.querySelector(".test1").value) || 0;
    let test2 = parseFloat(row.querySelector(".test2").value) || 0;
    let exam = parseFloat(row.querySelector(".exam").value) || 0;
    let total = test1 + test2 + exam;
    let {grade, remark} = getGrade(total);

    let docID = `${studentID}_${subjectID}_${term}_${year}`;
    await setDoc(doc(db,"results",docID),{
      studentID,
      className, // saved as className for consistency
      subjectID,
      subjectName,
      term,
      year,
      test1, test2, exam, total, grade, remark,
      staffID,
      status: "Pending",
      createdAt: new Date()
    });
    saved++;
  }

  showAlert(`${saved} results saved as Pending. ${skipped} already existed and were skipped.`);

  setTimeout(()=>{ window.location.reload(); }, 2000);
}
</script>
</body>
</html>
