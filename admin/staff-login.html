<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/x-icon" href="../images/logo1 - Copy.png">

<title>Greysol Academy | Staff Login</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at top right,
            rgba(0, 74, 128, 0.45),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(0, 31, 63, 0.8),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #001f3f,
            #003b66
        );

    padding: 20px;
}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-box {

    width: 100%;
    max-width: 420px;

    background: rgba(255, 255, 255, 0.98);

    padding: 42px 40px 35px;

    border-radius: 20px;

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.30);

    text-align: center;

    animation: fadeIn 0.45s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   LOGO
========================================================= */

.logo-container {

    width: 105px;
    height: 105px;

    margin: 0 auto 18px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: #f4f7fb;

    box-shadow:
        0 5px 15px rgba(0, 31, 63, 0.10);
}

.logo {

    width: 82px;
    height: 82px;

    object-fit: contain;
}


/* =========================================================
   HEADINGS
========================================================= */

h1 {

    color: #001f3f;

    font-size: 25px;

    font-weight: 700;

    letter-spacing: 0.5px;

    margin-bottom: 6px;
}

.subtitle {

    color: #777;

    font-size: 14px;

    margin-bottom: 30px;
}


/* =========================================================
   FORM
========================================================= */

.form-group {

    text-align: left;

    margin-bottom: 17px;
}

.form-group label {

    display: block;

    color: #34495e;

    font-size: 13px;

    font-weight: 600;

    margin-bottom: 7px;
}


/* =========================================================
   INPUTS
========================================================= */

input {

    width: 100%;

    height: 48px;

    padding: 0 14px;

    border-radius: 9px;

    border: 1px solid #d5dbe2;

    background: #fafbfc;

    color: #222;

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

input::placeholder {
    color: #9aa3ad;
}

input:focus {

    background: #fff;

    border-color: #003366;

    box-shadow:
        0 0 0 3px rgba(0, 51, 102, 0.10);
}


/* =========================================================
   PASSWORD FIELD
========================================================= */

.password-wrapper {

    position: relative;

    width: 100%;
}

.password-wrapper input {

    padding-right: 48px;
}


/* Professional SVG eye button */

.toggle-password {

    position: absolute;

    right: 12px;

    top: 50%;

    transform: translateY(-50%);

    width: 30px;
    height: 30px;

    display: flex;

    justify-content: center;

    align-items: center;

    border: none;

    background: transparent;

    color: #7a8693;

    cursor: pointer;

    padding: 0;

    margin: 0;

    border-radius: 6px;

    transition:
        color 0.2s ease,
        background 0.2s ease;
}

.toggle-password:hover {

    color: #001f3f;

    background: #eef3f8;
}

.toggle-password:focus-visible {

    outline: 2px solid #003366;

    outline-offset: 2px;
}

.toggle-password svg {

    width: 20px;
    height: 20px;

    stroke: currentColor;

    fill: none;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

#loginBtn {

    width: 100%;

    height: 50px;

    margin-top: 8px;

    border: none;

    border-radius: 9px;

    background: linear-gradient(
        135deg,
        #001f3f,
        #003b66
    );

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
}

#loginBtn:hover {

    transform: translateY(-1px);

    box-shadow:
        0 7px 18px rgba(0, 31, 63, 0.25);
}

#loginBtn:active {

    transform: translateY(0);
}

#loginBtn:disabled {

    opacity: 0.65;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;
}


/* =========================================================
   ERROR MESSAGE
========================================================= */

.error {

    min-height: 20px;

    margin-top: 14px;

    color: #c62828;

    font-size: 13px;

    line-height: 1.4;
}


/* =========================================================
   DIVIDER
========================================================= */

.divider {

    display: flex;

    align-items: center;

    gap: 12px;

    margin: 22px 0;

    color: #a0a7af;

    font-size: 12px;
}

.divider::before,
.divider::after {

    content: "";

    flex: 1;

    height: 1px;

    background: #e5e8ec;
}


/* =========================================================
   STUDENT LOGIN LINK
========================================================= */

.links {

    text-align: center;
}

.links a {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    color: #001f3f;

    text-decoration: none;

    font-size: 14px;

    font-weight: 600;

    transition: color 0.2s ease;
}

.links a:hover {

    color: #0074b7;

    text-decoration: underline;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 25px;

    padding-top: 18px;

    border-top: 1px solid #edf0f3;

    color: #9aa1a9;

    font-size: 11px;

    line-height: 1.5;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    body {

        padding: 15px;
    }

    .login-box {

        padding: 32px 24px 25px;

        border-radius: 17px;
    }

    .logo-container {

        width: 90px;
        height: 90px;
    }

    .logo {

        width: 70px;
        height: 70px;
    }

    h1 {

        font-size: 22px;
    }

    .subtitle {

        margin-bottom: 24px;
    }
}

</style>

</head>

<body>

<div class="login-box">

```

</div>

<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getFirestore,
    collection,
    query,
    where,
    getDocs

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAgoW4EU_hvrWHSxJciW0qUWeUXOr-msgw",

    authDomain: "greysol-academy.firebaseapp.com",

    projectId: "greysol-academy",

    storageBucket: "greysol-academy.firebasestorage.app",

    messagingSenderId: "700477093508",

    appId: "1:700477093508:web:d1f95a63483b8e9ab934d1",

    measurementId: "G-XY8XSZJ9HE"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



/* =========================================================
   ELEMENTS
========================================================= */

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const errorMessage =
    document.getElementById("error");

const togglePassword =
    document.getElementById("togglePassword");

const eyeIcon =
    document.getElementById("eyeIcon");



/* =========================================================
   SHOW / HIDE PASSWORD
========================================================= */

togglePassword.addEventListener(
    "click",
    function () {

        const isPassword =
            passwordInput.type === "password";


        if (isPassword) {

            passwordInput.type = "text";

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

            togglePassword.setAttribute(
                "title",
                "Hide password"
            );


            /* Change eye to crossed eye */

            eyeIcon.innerHTML = `

                <path
                    d="M3 3l18 18"
                ></path>

                <path
                    d="M10.6 5.1
                       A10.8 10.8 0 0 1 12 5
                       c6.5 0 10 7 10 7
                       a18.3 18.3 0 0 1-3.1 4.2"
                ></path>

                <path
                    d="M6.2 6.2
                       C3.5 8.1 2 12 2 12
                       s3.5 7 10 7
                       c1.8 0 3.4-.5 4.8-1.2"
                ></path>

            `;

        }

        else {

            passwordInput.type = "password";

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

            togglePassword.setAttribute(
                "title",
                "Show password"
            );


            /* Normal eye */

            eyeIcon.innerHTML = `

                <path
                    d="M2 12s3.5-7 10-7
                       10 7 10 7-3.5 7-10 7
                       S2 12 2 12z"
                ></path>

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                ></circle>

            `;

        }

    }
);



/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
    "click",
    loginUser
);



/* =========================================================
   ENTER KEY LOGIN
========================================================= */

passwordInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            loginUser();

        }

    }
);


usernameInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            passwordInput.focus();

        }

    }
);



/* =========================================================
   LOGIN FUNCTION
========================================================= */

async function loginUser() {


    const username =
        usernameInput.value.trim();


    const password =
        passwordInput.value.trim();


    errorMessage.textContent = "";


    /* Validate */

    if (
        username === "" ||
        password === ""
    ) {

        errorMessage.textContent =
            "Please enter your username and password.";

        return;

    }


    /* Disable button */

    loginBtn.disabled = true;

    loginBtn.textContent = "Signing in...";


    try {


        /* Query Firebase */

        const q = query(

            collection(db, "users"),

            where(
                "username",
                "==",
                username
            ),

            where(
                "password",
                "==",
                password
            )

        );


        const snapshot =
            await getDocs(q);


        /* No matching user */

        if (snapshot.empty) {

            errorMessage.textContent =
                "Invalid username or password.";

            return;

        }


        /* Get user */

        const user =
            snapshot.docs[0].data();


        /* Check account status */

        if (user.status !== "Active") {

            errorMessage.textContent =
                "Your account is inactive. Please contact the administrator.";

            return;

        }


        /* =================================================
           SAVE LOGIN SESSION
        ================================================= */

        localStorage.setItem(

            "loggedUser",

            JSON.stringify({

                username:
                    user.username,

                role:
                    user.role,

                staffID:
                    user.staffID,

                permissions:
                    user.permissions || {}

            })

        );


        /* =================================================
           REDIRECT BASED ON ROLE
        ================================================= */

        switch (user.role) {


            case "Administrator":

                window.location.href =
                    "admin-dashboard.html";

                break;


            case "Head Teacher":

                window.location.href =
                    "headteacher-dashboard.html";

                break;


            case "Bursar":

            case "Accountant":

                window.location.href =
                    "accounting-dashboard.html";

                break;


            case "Teacher":

            case "Class Teacher":

                window.location.href =
                    "teacher-dashboard.html";

                break;


            default:

                window.location.href =
                    "admin-dashboard.html";

                break;

        }


    }

    catch (err) {

        console.error(
            "Login error:",
            err
        );


        errorMessage.textContent =
            "Unable to connect to the server. Please try again.";

    }


    finally {

        loginBtn.disabled = false;

        loginBtn.textContent = "Login";

    }

}

</script>

</body>
