<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="../images/logo1 - Copy.png">

<title>
Greysol Academy Staff Login
</title>




<style>


*{

box-sizing:border-box;

font-family:'Segoe UI',Arial,sans-serif;

}



body{


margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(

135deg,

#001f3f,

#003366

);


}





.login-box{


background:white;

width:400px;

padding:40px;

border-radius:20px;

box-shadow:

0 10px 30px rgba(0,0,0,.3);

text-align:center;


}





.logo{


width:100px;

height:100px;

object-fit:contain;


}






h1{


color:#001f3f;

margin-bottom:5px;


}





.subtitle{


color:#777;

margin-bottom:30px;


}






input{


width:100%;

padding:14px;

margin:10px 0;

border-radius:8px;

border:1px solid #ccc;

font-size:15px;


}








button{


width:100%;

padding:14px;

background:#001f3f;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

font-size:16px;

margin-top:15px;


}




button:hover{


background:#003366;


}





.error{


color:red;

margin-top:15px;

font-size:14px;


}





.links{


margin-top:25px;

}



.links a{


color:#001f3f;

text-decoration:none;

font-weight:bold;


}




</style>


</head>






<body>




<div class="login-box">



<img src="../images/logo1 - Copy.png" class="logo">



<h1>

GREYSOL ACADEMY

</h1>



<p class="subtitle">

Staff Portal Login

</p>








<input

id="username"

placeholder="Username"

autocomplete="username">







<input

id="password"

type="password"

placeholder="Password"

autocomplete="current-password">







<button id="loginBtn">


Login


</button>






<p id="error"

class="error">

</p>






<div class="links">


<a href="student-login.html">

Student Login

</a>


</div>







</div>









<script type="module">


import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {


getFirestore,

collection,

query,

where,

getDocs


}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";









// ===============================
// FIREBASE CONFIG
// ===============================


const firebaseConfig = {


apiKey: "AIzaSyAgoW4EU_hvrWHSxJciW0qUWeUXOr-msgw",

authDomain: "greysol-academy.firebaseapp.com",

projectId: "greysol-academy",

storageBucket: "greysol-academy.firebasestorage.app",

messagingSenderId: "700477093508",

appId: "1:700477093508:web:d1f95a63483b8e9ab934d1",

measurementId: "G-XY8XSZJ9HE"


};







const app = initializeApp(firebaseConfig);


const db = getFirestore(app);









document

.getElementById("loginBtn")

.onclick = async function(){






let username =

document

.getElementById("username")

.value

.trim();







let password =

document

.getElementById("password")

.value

.trim();







let error =

document

.getElementById("error");








error.innerHTML="";







if(username==="" || password===""){


error.innerHTML=

"Enter username and password";


return;


}








try{







const q = query(


collection(db,"users"),



where(

"username",

"==",

username

),



where(

"password",

"==",

password

)



);









const snapshot = await getDocs(q);








if(snapshot.empty){



error.innerHTML=

"Invalid username or password";


return;


}









const user = snapshot.docs[0].data();









if(user.status !== "Active"){



error.innerHTML=

"Account is inactive";


return;


}











// SAVE LOGIN SESSION


localStorage.setItem(

"loggedUser",

JSON.stringify({

username:user.username,

role:user.role,

staffID:user.staffID,

permissions:user.permissions || {}

})


);












// ===============================
// REDIRECT BASED ON ROLE
// ===============================


switch(user.role){


case "Administrator":

window.location.href="admin-dashboard.html";

break;



case "Head Teacher":

window.location.href="headteacher-dashboard.html";

break;



case "Bursar":

case "Accountant":

window.location.href="accounting-dashboard.html";

break;



case "Teacher":

case "Class Teacher":

window.location.href="teacher-dashboard.html";

break;



default:

window.location.href="admin-dashboard.html";


}






}

catch(error){



console.error(error);


error.innerHTML=

error.message;


}



};






</script>





</body>

</html>
