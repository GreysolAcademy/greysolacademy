<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice View | Greysol Academy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
:root{--navy:#001f3f;--light:#f4f7fb;--green:#27ae60;--orange:#f39c12;--red:#c0392b}
body{margin:0;background:var(--light);padding:30px}
.box{background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1);max-width:900px;margin:0 auto}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:20px;margin-bottom:20px}
.school-info{display:flex;gap:15px;align-items:center}
.school-info img{width:80px;height:80px;object-fit:contain}
.school-info h1{margin:0;font-size:24px;color:var(--navy)}
.invoice-title{text-align:right}
.invoice-title h2{margin:0;color:var(--navy);font-size:28px;letter-spacing:2px}
.status-badge{padding:8px 15px;border-radius:20px;color:white;font-weight:bold;display:inline-block;margin-top:5px}
.paid{background:var(--green)}
.partial{background:var(--orange)}
.unpaid{background:var(--red)}

/* DETAILS */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px}
.info-item label{font-size:12px;color:#777;display:block;text-transform:uppercase}
.info-item p{margin:5px 0;font-weight:bold;color:var(--navy);font-size:16px}

/* ITEMS TABLE */
.items-table{width:100%;border-collapse:collapse;margin:20px 0}
.items-table th{background:var(--navy);color:white;padding:12px;text-align:left}
.items-table td{padding:12px;border-bottom:1px solid #ddd}
.text-right{text-align:right}
.summary-row td{padding:10px 12px}
.total-row td{font-weight:bold;background:#f4f7fb;font-size:18px}
.subtotal td{border-top:2px solid var(--navy)}

/* PAYMENTS */
.payments-box{margin-top:30px}
.payment-row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee}

/* BUTTONS */
.btn-group{display:flex;gap:10px;justify-content:flex-end;margin-top:30px}
.btn{padding:12px 25px;border-radius:8px;border:none;cursor:pointer;font-weight:bold;font-size:14px}
.btn-print{background:var(--navy);color:white}
.btn-back{background:#7f8c8d;color:white}
.btn-pay{background:var(--green);color:white}

/* LOADER INSIDE TABLE */
.loading-cell{text-align:center;padding:40px;color:var(--navy)}
.loading-cell i{font-size:48px;color:var(--navy);animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.hidden{display:none}
@media print{
  body{background:white;padding:0}
  .box{box-shadow:none;padding:0;max-width:100%}
  .btn-group{display:none}
}
</style>
</head>
<body>

<div class="box">
  <!-- HEADER -->
  <div class="header">
    <div class="school-info">
      <img src="../images/logo1 - Copy.png" alt="Greysol Logo">
      <div>
        <h1>GREYSOL ACADEMY</h1>
        <p>Blantyre, Malawi</p>
        <p>Tel: +265 1 234 567</p>
      </div>
    </div>
    <div class="invoice-title">
      <h2>INVOICE</h2>
      <p><b>No:</b> <span id="invoiceNo">Loading...</span></p>
      <p><b>Date:</b> <span id="invoiceDate">-</span></p>
      <span id="statusBadge" class="status-badge">-</span>
    </div>
  </div>

  <!-- STUDENT INFO -->
  <div class="info-grid">
    <div class="info-item">
      <label>Bill To</label>
      <p id="studentName">-</p>
      <p id="studentID">-</p>
    </div>
    <div class="info-item">
      <label>Class</label>
      <p id="studentClass">-</p>
    </div>
    <div class="info-item">
      <label>Academic Year</label>
      <p id="academicYear">-</p>
    </div>
    <div class="info-item">
      <label>Term</label>
      <p id="term">-</p>
    </div>
  </div>

  <!-- ITEMS TABLE WITH LOADER INSIDE -->
  <table class="items-table">
    <thead>
      <tr>
        <th style="width:5%">#</th>
        <th>Description</th>
        <th class="text-right" style="width:20%">Amount MWK</th>
      </tr>
    </thead>
    <tbody id="itemsBody">
      <tr id="itemsLoader">
        <td colspan="3" class="loading-cell">
          <i class="fa-solid fa-circle-notch"></i>
          <p>Loading invoice items...</p>
        </td>
      </tr>
    </tbody>
    <tfoot id="invoiceTotals" class="hidden">
      <tr class="summary-row subtotal">
        <td colspan="2" class="text-right">Subtotal:</td>
        <td class="text-right" id="subTotalAmount">MWK 0</td>
      </tr>
      <tr class="summary-row" id="discountRow" style="display:none">
        <td colspan="2" class="text-right">Discount <span id="discountLabel"></span>:</td>
        <td class="text-right" id="discountAmount">MWK 0</td>
      </tr>
      <tr class="summary-row" id="vatRow" style="display:none">
        <td colspan="2" class="text-right">VAT <span id="vatLabel"></span>:</td>
        <td class="text-right" id="vatAmount">MWK 0</td>
      </tr>
      <tr class="total-row">
        <td colspan="2" class="text-right">TOTAL:</td>
        <td class="text-right" id="totalAmount">MWK 0</td>
      </tr>
      <tr>
        <td colspan="2" class="text-right">PAID:</td>
        <td class="text-right" id="paidAmount">MWK 0</td>
      </tr>
      <tr class="total-row">
        <td colspan="2" class="text-right">BALANCE:</td>
        <td class="text-right" id="balanceAmount">MWK 0</td>
      </tr>
    </tfoot>
  </table>

  <!-- PAYMENT HISTORY WITH LOADER -->
  <div class="payments-box">
    <h3>Payment History</h3>
    <div id="paymentsList">
      <div class="loading-cell">
        <i class="fa-solid fa-circle-notch"></i>
        <p>Loading payments...</p>
      </div>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="btn-group">
    <button class="btn btn-pay" id="payBtn"><i class="fa-solid fa-money-bill"></i> Record Payment</button>
    <button class="btn btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
    <button class="btn btn-back" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({apiKey:"AIzaSyAgoW4eu_hvrWHSxJciW0qUWeUXOr-msgw",projectId:"greysol-academy"});
const db = getFirestore(app);

// ROLE CHECK
const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
const allowedRoles = ["administrator", "bursar", "accountant"];
const userRole = (loggedUser?.role || "").toString().trim().toLowerCase();
if(!loggedUser || !allowedRoles.includes(userRole)){
  alert("Access Denied");
  window.location.href = "staff-login.html";
}

// GET ID FROM URL
const urlParams = new URLSearchParams(window.location.search);
const invoiceId = urlParams.get('id');

if(!invoiceId){
  alert("No Invoice ID provided");
  window.history.back();
}

let currentInvoice = null;

async function loadInvoice(){
  try{
    const docRef = doc(db,"invoices", invoiceId);
    const docSnap = await getDoc(docRef);

    if(!docSnap.exists()){
      alert("Invoice not found");
      window.history.back();
      return;
    }

    currentInvoice = {id: docSnap.id, ...docSnap.data()};
    displayInvoice(currentInvoice);
    loadPayments(currentInvoice);

  }catch(error){
    console.error(error);
    document.getElementById("itemsBody").innerHTML = `<tr><td colspan="3" style="color:red;text-align:center">Error: ${error.message}</td></tr>`;
  }
}

function displayInvoice(inv){
  document.getElementById("invoiceNo").innerText = inv.invoiceNo;
  document.getElementById("invoiceDate").innerText = formatDate(inv.invoiceDate);
  document.getElementById("studentName").innerText = inv.studentName;
  document.getElementById("studentID").innerText = "ID: " + inv.studentID;
  document.getElementById("studentClass").innerText = inv.class;
  document.getElementById("academicYear").innerText = inv.academicYear;
  document.getElementById("term").innerText = inv.term;

  const status = inv.status || "Unpaid";
  document.getElementById("statusBadge").innerText = status;
  document.getElementById("statusBadge").className = "status-badge " + status.toLowerCase();

  // ITEMS - CLEAR LOADER FIRST
  const tbody = document.getElementById("itemsBody");
  tbody.innerHTML = "";
  if(inv.items && inv.items.length > 0){
    inv.items.forEach((item,i)=>{
      tbody.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>${item.description}</td>
        <td class="text-right">${Number(item.amount).toLocaleString()}</td>
      </tr>`;
    });
  } else {
    tbody.innerHTML = `<tr><td colspan="3">No items</td></tr>`;
  }

  // CALCULATION BREAKDOWN
  const subTotal = Number(inv.subTotal || 0);
  const discountAmount = Number(inv.discountAmount || 0);
  const vatAmount = Number(inv.vatAmount || 0);
  const vatPercent = Number(inv.vatPercent || 0);
  const discountType = inv.discountType || "percent";
  const discountValue = Number(inv.discountValue || 0);
  const discountApply = inv.discountApply || "before";

  document.getElementById("subTotalAmount").innerText = "MWK " + subTotal.toLocaleString();

  // Show discount only if > 0
  if(discountAmount > 0){
    document.getElementById("discountRow").style.display = "table-row";
    const label = discountType === "percent" ? `(${discountValue}%)` : "(Fixed)";
    const applyText = discountApply === "before" ? "Before VAT" : "After VAT";
    document.getElementById("discountLabel").innerText = `${label} ${applyText}`;
    document.getElementById("discountAmount").innerText = "MWK " + discountAmount.toLocaleString();
  }

  // Show VAT only if > 0
  if(vatAmount > 0){
    document.getElementById("vatRow").style.display = "table-row";
    document.getElementById("vatLabel").innerText = `(${vatPercent}%)`;
    document.getElementById("vatAmount").innerText = "MWK " + vatAmount.toLocaleString();
  }

  document.getElementById("totalAmount").innerText = "MWK " + Number(inv.totalAmount).toLocaleString();
  document.getElementById("paidAmount").innerText = "MWK " + Number(inv.amountPaid || 0).toLocaleString();
  document.getElementById("balanceAmount").innerText = "MWK " + Number(inv.balance || 0).toLocaleString();
  document.getElementById("invoiceTotals").classList.remove("hidden");

  // Hide pay button if paid
  if(status === "Paid"){
    document.getElementById("payBtn").style.display = "none";
  }
}

async function loadPayments(inv){
  try{
    const receiptSnap = await getDocs(collection(db,"receipts"));
    const allReceipts = receiptSnap.docs.map(d=>({id:d.id,...d.data()}));
    
    const payments = allReceipts.filter(r => 
      r.allocations && r.allocations.some(a => a.invoiceNo === inv.invoiceNo)
    );

    const paymentsDiv = document.getElementById("paymentsList");
    paymentsDiv.innerHTML = ""; // CLEAR LOADER

    if(payments.length === 0){
      paymentsDiv.innerHTML = "<p>No payments yet</p>";
      return;
    }

    let html = "";
    payments.forEach(p=>{
      const allocation = p.allocations.find(a => a.invoiceNo === inv.invoiceNo);
      html += `
      <div class="payment-row">
        <div>
          <b>${p.receiptNo}</b><br>
          <small>${formatDate(p.paymentDate)} | ${p.paymentMethod}</small>
        </div>
        <div style="text-align:right">
          <b>MWK ${Number(allocation.amount).toLocaleString()}</b><br>
          <small>Ref: ${p.reference || '-'}</small>
        </div>
      </div>`;
    });
    paymentsDiv.innerHTML = html;

  }catch(e){
    document.getElementById("paymentsList").innerHTML = "<p>Error loading payments</p>";
  }
}

document.getElementById("payBtn").onclick = () => {
  window.location.href = `payments.html?id=${invoiceId}`;
}

function formatDate(timestamp){
  if(!timestamp) return "-";
  const date = timestamp.toDate? timestamp.toDate() : new Date(timestamp);
  return date.toLocaleDateString("en-GB", {day:'2-digit', month:'long', year:'numeric'});
}

loadInvoice();
</script>
</body>
</html>
