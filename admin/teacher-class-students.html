<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greysol Academy | My Class Students</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
:root{--navy:#001f3f;--blue:#003366;--light:#f4f7fb}
body{margin:0;background:var(--light);display:flex;height:100vh;overflow:hidden}
.sidebar{width:270px;background:var(--navy);color:white;height:100vh;overflow:auto;position:fixed;left:0;z-index:1000;transition:.3s}
.sidebar.hide{left:-270px}
.logo{text-align:center;padding:20px;border-bottom:1px solid rgba(255,255,255,.2); position:relative;}
.close-btn{position:absolute;top:15px;right:15px;font-size:24px;cursor:pointer;display:none;color:white}
.menu a{display:flex;align-items:center;gap:15px;padding:15px 25px;color:white;text-decoration:none}
.menu a.active{background:rgba(255,255,255,.1)}
.main{flex:1;display:flex;flex-direction:column;margin-left:270px;transition:.3s}
.topbar{height:75px;background:white;display:flex;justify-content:space-between;align-items:center;padding:0 30px;box-shadow:0 3px 10px rgba(0,0,0,.1);position:sticky;top:0;z-index:999}
.menu-toggle{display:none;font-size:24px;cursor:pointer;color:var(--navy)}
.content{padding:30px;overflow:auto}
.box{background:white;padding:25px;border-radius:15px;margin-bottom:25px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:20px}
select{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.btn-print{background:#27ae60;color:white}
.btn-print:hover{background:#219150}
table{width:100%;border-collapse:collapse}
th{background:var(--navy);color:white;padding:12px;text-align:left}
td{padding:12px;border-bottom:1px solid #ddd}
.badge{background:#27ae60;color:white;padding:5px 10px;border-radius:15px;font-size:12px}

/* PRINT HEADER - HIDDEN ON SCREEN */
.print-header{display:none;text-align:center;margin-bottom:20px}
.print-header h1{color:var(--navy);margin:5px}
.print-header p{margin:2px}

@media(max-width:900px){
.sidebar{left:-270px}.sidebar.show{left:0}
.sidebar.show.close-btn{display:block} /* SHOW X WHEN OPEN */
.main{margin-left:0}
.menu-toggle{display:block}
.content{padding:15px}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999}
.overlay.show{display:block}
}

/* PRINT STYLES */
@media print{
body{background:white}
.sidebar,.topbar,.box:first-child,.btn-print{display:none!important}
.main{margin-left:0!important}
.content{padding:0}
.print-header{display:block!important}
table{border:1px solid #000}
th{background:#001f3f!important; color:white!important; -webkit-print-color-adjust: exact; print-color-adjust: exact;}
td{border-bottom:1px solid #ddd}
.badge{background:#27ae60!important; color:white!important; -webkit-print-color-adjust: exact; print-color-adjust: exact;}
}
</style>
</head>
<body>

<!-- OVERLAY TO CLOSE NAV ON MOBILE -->
<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="logo">
    <i class="fa-solid fa-xmark close-btn" id="closeNav"></i> <!-- CHANGED CLASS -->
    <h2>GREYSOL ACADEMY</h2><p>Teacher Portal</p>
  </div>
  <div class="menu">
    <a href="teacher-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="teacher-class-students.html" class="active"><i class="fa-solid fa-users"></i> My Classes</a>
    <a href="teacher-attendance.html"><i class="fa-solid fa-clipboard-check"></i> Attendance</a>
    <a href="teacher-results.html"><i class="fa-solid fa-file-lines"></i> Enter Results</a>
    <a href="staff-login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </div>
</div>

<div class="main" id="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:15px">
      <i class="fa-solid fa-bars menu-toggle" id="menuToggle"></i>
      <h2>My Class Students</h2>
    </div>
    <span id="teacherName"></span>
  </div>

  <div class="content">
    <div class="box">
      <h3><i class="fa-solid fa-filter"></i> Select Subject & Class</h3>
      <div class="form-grid">
        <div>
          <label>Subject - Class</label>
          <select id="allocationSelect">
            <option value="">Loading your allocations...</option>
          </select>
        </div>
        <div style="align-self:end">
          <button class="btn btn-print" onclick="printList()"><i class="fa-solid fa-print"></i> Print List</button>
        </div>
      </div>
    </div>

    <div class="box" id="printArea">
      <div class="print-header">
        <h1>GREYSOL ACADEMY</h1>
        <p>Student List</p>
        <p id="printTitle">Subject - Class</p>
        <p id="printDate"></p>
        <hr>
      </div>

      <h3 id="listTitle"><i class="fa-solid fa-users"></i> Students</h3>
      <p id="classInfo" style="color:#666;margin-bottom:15px">Select a subject to view students</p>
      <table>
        <thead>
          <tr><th>#</th><th>Student ID Number</th><th>Student Name</th><th>Gender</th><th>Status</th></tr> <!-- CHANGED HERE -->
        </thead>
        <tbody id="studentTable">
          <tr><td colspan="5">Select a subject above</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

document.getElementById("menuToggle").onclick = () => {
  sidebar.classList.add("show");
  overlay.classList.add("show");
}

// CLOSE NAV: click X or overlay
document.getElementById("closeNav").onclick = closeNav;
overlay.onclick = closeNav;
function closeNav(){
  sidebar.classList.remove("show");
  overlay.classList.remove("show");
}

// PRINT FUNCTION
function printList(){
  const title = document.getElementById("listTitle").innerText;
  document.getElementById("printTitle").innerText = title;
  document.getElementById("printDate").innerText = "Printed on: " + new Date().toLocaleDateString();

  if(document.getElementById("studentTable").innerText.includes("Select a subject")){
    alert("Please select a subject first");
    return;
  }
  window.print();
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({apiKey:"AIzaSyAgoW4eu_hvrWHSxJciW0qUWeUXOr-msgw",authDomain:"greysol-academy.firebaseapp.com",projectId:"greysol-academy"});
const db = getFirestore(app);

const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
if(!loggedUser){ window.location.href="staff-login.html"; }

let allocations = [];
let staffID = "";

async function init(){
  const staffSnap = await getDocs(query(collection(db,"staff"), where("username","==",loggedUser.username)));
  if(staffSnap.empty){ alert("Teacher record not found"); return; }
  const teacher = staffSnap.docs[0].data();
  staffID = teacher.staffID;
  document.getElementById("teacherName").innerText = `${teacher.firstName} ${teacher.surname}`;

  const allocSnap = await getDocs(query(collection(db,"allocations"), where("staffID","==",staffID)));
  const select = document.getElementById("allocationSelect");
  select.innerHTML = `<option value="">Select Subject - Class</option>`;

  allocSnap.forEach(d=>{
    let a = d.data();
    allocations.push({id:d.id,...a});
    select.innerHTML += `<option value="${a.class}|${a.subjectName}">${a.subjectName} - ${a.class}</option>`;
  });

  if(allocations.length === 0){
    select.innerHTML = `<option disabled>No subjects allocated to you</option>`;
  }
}
init();

document.getElementById("allocationSelect").onchange = async function(){
  const val = this.value;
  if(!val) return;
  const [className, subjectName] = val.split("|");
  document.getElementById("listTitle").innerHTML = `<i class="fa-solid fa-users"></i> ${subjectName} - ${className}`;
  document.getElementById("classInfo").innerText = `Showing students in ${className} for ${subjectName}`;
  await loadStudents(className);
}

async function loadStudents(className){
  const tbody = document.getElementById("studentTable");
  tbody.innerHTML = "Loading...";
  const snap = await getDocs(query(collection(db,"students"), where("class","==",className)));

  if(snap.empty){
    tbody.innerHTML = `<tr><td colspan="5">No students found in ${className}</td></tr>`;
    return;
  }

  let students = [];
  snap.forEach(d=> students.push(d.data()));
  students.sort((a,b)=> (a.surname||"").localeCompare(b.surname||""));

  let count = 1;
  tbody.innerHTML = "";
  students.forEach(s=>{
    tbody.innerHTML += `<tr>
      <td>${count++}</td>
      <td>${s.admissionNo || s.studentID || '-'}</td> <!-- CHECKS BOTH FIELDS -->
      <td>${s.firstName || ''} ${s.surname || ''}</td>
      <td>${s.gender || '-'}</td>
      <td><span class="badge">${s.status || 'Active'}</span></td>
    </tr>`;
  });
}
</script>
</body>
</html>
